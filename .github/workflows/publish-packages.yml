name: Publish NuGet packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (for example, 1.0.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore projects
        run: |
          dotnet restore StoryBoard.SampleProjects.csproj
          dotnet restore StoryBoard.SourceAssets.csproj

      - name: Pack sample projects
        run: >-
          dotnet pack StoryBoard.SampleProjects.csproj
          --configuration Release
          --no-restore
          --output artifacts
          -p:PackageVersion=${{ inputs.version }}

      - name: Pack source assets
        run: >-
          dotnet pack StoryBoard.SourceAssets.csproj
          --configuration Release
          --no-restore
          --output artifacts
          -p:PackageVersion=${{ inputs.version }}

      - name: Publish packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate
          done
